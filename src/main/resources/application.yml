spring:

  application:
    name: products-service

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test-db
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create

  h2:
    console:
      enabled: true
      path: /h2-consoles

springdoc:

  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /v3/api-docs
    operations-sorter: alpha # method # alpha # method
    display-request-duration: true
    doc-expansion: list
    persist-authorization: true

